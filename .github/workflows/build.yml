name: Build NightCap Camera (Android Kotlin & iOS Swift)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  build-android:
    name: Build Android (Kotlin Native)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'android' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Android Keystore (if configured)
        id: android_signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "keystore_path=${{ runner.temp }}/release.keystore" >> $GITHUB_OUTPUT
            echo "signed_mode=release-keystore" >> $GITHUB_OUTPUT
          else
            echo "keystore_path=" >> $GITHUB_OUTPUT
            echo "signed_mode=debug-fallback" >> $GITHUB_OUTPUT
          fi

      - name: Build Android APKs (Kotlin)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.android_signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Package Android Artifacts
        run: |
          mkdir -p build-output/android
          cp app/build/outputs/apk/debug/app-debug.apk build-output/android/NightCapCamera-debug.apk
          cp app/build/outputs/apk/release/app-release.apk build-output/android/NightCapCamera-release.apk
          cd build-output/android
          sha256sum NightCapCamera-*.apk > checksums-android.txt
          ls -lh

      - name: Write Android Build Summary
        run: |
          {
            echo "### Android Build (Kotlin + Jetpack Compose)"
            echo "- **Signing Mode:** \`${{ steps.android_signing.outputs.signed_mode }}\`"
            echo "- **Files:**"
            ls -lh build-output/android/NightCapCamera-*.apk | awk '{print "  - `" $9 "` (" $5 ")"}'
            echo ""
            echo "**SHA-256 Checksums:**"
            echo '```'
            cat build-output/android/checksums-android.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightCapCamera-Android-APK
          path: build-output/android/
          retention-days: 30

  build-ios:
    name: Build iOS (Swift Native -> IPA)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_target == 'all' || inputs.build_target == 'ios' }}
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode Environment
        run: |
          xcodebuild -version
          xcodebuild -list -project iosApp/NightCapCamera.xcodeproj

      - name: Configure iOS Signing (if secrets provided)
        id: ios_signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$PROFILE_B64" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
            KEYCHAIN_PASS=$(openssl rand -base64 24)

            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

            echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
          fi

      - name: Build & Export Signed IPA (when certificates are configured)
        if: steps.ios_signing.outputs.has_signing == 'true'
        run: |
          mkdir -p build-output/ios
          xcodebuild archive \
            -project iosApp/NightCapCamera.xcodeproj \
            -scheme NightCapCamera \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/NightCapCamera.xcarchive

          xcodebuild -exportArchive \
            -archivePath build/NightCapCamera.xcarchive \
            -exportPath build-output/ios \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Build & Package IPA (Ad-Hoc / Sideload Ready)
        if: steps.ios_signing.outputs.has_signing != 'true'
        run: |
          mkdir -p build-output/ios build/Payload
          xcodebuild build \
            -project iosApp/NightCapCamera.xcodeproj \
            -scheme NightCapCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Built .app bundle not found!"
            exit 1
          fi

          cp -R "$APP_PATH" build/Payload/NightCapCamera.app
          cd build
          zip -r -y ../build-output/ios/NightCapCamera.ipa Payload
          cd ..

      - name: Verify IPA & Generate Checksums
        run: |
          cd build-output/ios
          ls -lh NightCapCamera.ipa
          unzip -t NightCapCamera.ipa | tail -n 5
          shasum -a 256 NightCapCamera.ipa > checksums-ios.txt

      - name: Write iOS Build Summary
        run: |
          {
            echo "### iOS Build (Swift + SwiftUI + Metal)"
            echo "- **Signed Mode:** \`${{ steps.ios_signing.outputs.has_signing }}\`"
            echo "- **File:** \`build-output/ios/NightCapCamera.ipa\`"
            ls -lh build-output/ios/NightCapCamera.ipa | awk '{print "  - Size: " $5}'
            echo ""
            echo "**SHA-256 Checksum:**"
            echo '```'
            cat build-output/ios/checksums-ios.txt
            echo '```'
            if [ "${{ steps.ios_signing.outputs.has_signing }}" != "true" ]; then
              echo ""
              echo "> **Note:** Built without Apple Developer secrets. Install \`NightCapCamera.ipa\` on your iPhone/iPad via **AltStore**, **SideStore**, **Sideloadly**, or **TrollStore**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightCapCamera-iOS-IPA
          path: build-output/ios/
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [ build-android, build-ios ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: NightCapCamera-Android-APK
          path: release-assets/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: NightCapCamera-iOS-IPA
          path: release-assets/ios

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/android/NightCapCamera-release.apk
            release-assets/android/NightCapCamera-debug.apk
            release-assets/ios/NightCapCamera.ipa
